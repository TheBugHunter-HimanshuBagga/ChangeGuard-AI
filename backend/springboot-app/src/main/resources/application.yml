spring:
  application:
    name: changeguard-control-plane
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/changeguard}
    username: ${DB_USER:changeguard}
    password: ${DB_PASSWORD:changeguard}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

changeguard:
  security:
    jwt:
      # HS256 requires at least 32 characters (256 bits). Provide via env in real deployments.
      secret: ${JWT_SECRET:}
      ttl-minutes: ${JWT_TTL_MINUTES:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [cg-control-plane,%X{correlationId:-}]"
  level:
    root: INFO
