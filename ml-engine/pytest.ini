[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
filterwarnings =
    # Pydantic contract classes start with "Test*" (TestGenerationRequest, …);
    # pytest skips them (they have __init__) but warns — not test classes.
    ignore:cannot collect test class:pytest.PytestCollectionWarning
    # Third-party: starlette TestClient still uses httpx in this release
    # (StarletteDeprecationWarning subclasses UserWarning).
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
